# Template only. The real Secret is created out of band and never committed:
#
#   kubectl -n clip create secret generic clip-env \
#     --from-literal=DISCORD_APPLICATION_ID=... \
#     --from-literal=DISCORD_PUBLIC_KEY=... \
#     --from-literal=DISCORD_BOT_TOKEN=... \
#     --from-literal=ADMIN_SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=PUBLIC_BASE_URL=https://clipendpoint.cc
#
# DATABASE_URL is absent on purpose: CloudNativePG owns it via clip-db-app.
apiVersion: v1
kind: Secret
metadata:
  name: clip-env
  namespace: clip
type: Opaque
stringData:
  DISCORD_APPLICATION_ID: 'replace-me'
  DISCORD_PUBLIC_KEY: 'replace-me'
  DISCORD_BOT_TOKEN: 'replace-me'
  # Must be at least 32 characters; lib/env.ts rejects anything shorter.
  ADMIN_SESSION_SECRET: 'replace-me-with-openssl-rand-hex-32'
  PUBLIC_BASE_URL: 'https://clipendpoint.cc'
