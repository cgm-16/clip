apiVersion: apps/v1
kind: Deployment
metadata:
  name: clip
  namespace: clip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clip
  template:
    metadata:
      labels:
        app: clip
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001

      # `prisma migrate deploy` runs to completion before the app container
      # starts. It is forward-only and idempotent, so running it on every pod
      # start is safe; a non-zero exit here blocks the app container from
      # starting at all, rather than letting it serve against a stale schema.
      # Same image as the app — the Dockerfile bundles the Prisma CLI and its
      # own dependency closure alongside the standalone server, so migration
      # tooling can never drift out of sync with the code it migrates for.
      initContainers:
        - name: migrate
          # Must be bumped in lockstep with the app container's tag below.
          # Nothing enforces it, and a mismatch would run one wave's migrations
          # against another wave's code.
          image: ghcr.io/cgm-16/clip:sha-63a0ce1
          # Everything the migration needs lives under /migrate, away from the
          # standalone server's own traced node_modules. Running from /app fails
          # with "Cannot find module 'prisma/config'": prisma.config.ts imports
          # from the prisma package, and that only resolves next to it. The
          # config is where the datasource URL comes from -- schema.prisma
          # declares no `url` of its own.
          workingDir: /migrate
          command: ["node", "/migrate/node_modules/prisma/build/index.js", "migrate", "deploy"]
          env:
            # Same secret and key the app container reads its own
            # DATABASE_URL from.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clip-db-app
                  key: uri

      containers:
        - name: clip
          image: ghcr.io/cgm-16/clip:sha-63a0ce1
          ports:
            - containerPort: 3000

          env:
            # CloudNativePG owns this secret; the connection string is never
            # written by hand or committed.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clip-db-app
                  key: uri
          envFrom:
            - secretRef:
                name: clip-env

          # The node's other workloads declare no resources at all, which makes
          # them BestEffort. Declaring requests is what keeps Clip scheduled and
          # preemption-safe against them — omitting them would put Clip in the
          # same class it needs protection from.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 1Gi

          # Discord retries an interaction that does not answer in 3s, so a
          # wedged pod must leave the rotation quickly.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
