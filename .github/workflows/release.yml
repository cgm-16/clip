name: release

# Builds the deployable image and pushes it to GHCR. k3s cannot pull from a
# developer's Docker daemon, so the registry is the only path from a commit to
# the cluster — and building here rather than locally means the deployed image
# always corresponds to a commit that passed CI.
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN gains push rights to this repo's packages from these two
    # scopes alone, so no personal access token is involved.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<short> is the tag deploys pin to; `latest` exists for the
          # unauthenticated pull in the task's done-check, not for the cluster.
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Next.js builds are slow and this runs on every merge to main.
          cache-from: type=gha
          cache-to: type=gha,mode=max
