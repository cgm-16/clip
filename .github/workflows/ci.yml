name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clip
          POSTGRES_PASSWORD: clip
          POSTGRES_DB: clip_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://clip:clip@localhost:5432/clip_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated into a git-ignored directory, so it does
      # not exist on a fresh checkout. Everything after this needs it to typecheck.
      - run: pnpm prisma generate

      # Schema-invariant tests assert real Postgres constraint violations, so the
      # tables have to exist before the suite runs.
      - run: pnpm prisma migrate deploy

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
